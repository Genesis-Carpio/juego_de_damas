<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Juego de Damas Clásicas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="game-container">
    <!-- Encabezado -->
    <header>
      <div class="title-group">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a10 10 0 0 1 0 20"/>
        </svg>
        <h1>Damas Clásicas</h1>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btnTheme" class="btn-icon" title="Cambiar paleta de fondo">
          <span id="themeIcon">🎨</span> Fondo
        </button>
        <button id="btnSound" class="btn-icon" title="Activar/Silenciar sonido">
          <span id="soundIcon">🔊</span> Sonido
        </button>
      </div>
    </header>

    <!-- Marcador y Turno Actual -->
    <div class="scoreboard">
      <!-- Jugador Blancas -->
      <div id="cardWhite" class="player-card active">
        <div class="player-header">
          <div class="player-identity">
            <span class="mini-piece white"></span>
            <span class="player-name">Blancas</span>
          </div>
          <span class="turn-badge">Turno</span>
        </div>
        <div class="captured-stats">
          <span>Capturadas:</span>
          <span id="capturedWhite" class="captured-count">0 / 12</span>
        </div>
        <div id="graveyardWhite" class="graveyard" title="Piezas negras capturadas por las Blancas"></div>
      </div>

      <!-- Jugador Negras -->
      <div id="cardBlack" class="player-card">
        <div class="player-header">
          <div class="player-identity">
            <span class="mini-piece black"></span>
            <span class="player-name">Negras</span>
          </div>
          <span class="turn-badge">Turno</span>
        </div>
        <div class="captured-stats">
          <span>Capturadas:</span>
          <span id="capturedBlack" class="captured-count">0 / 12</span>
        </div>
        <div id="graveyardBlack" class="graveyard" title="Piezas blancas capturadas por las Negras"></div>
      </div>
    </div>

    <!-- Barra de Estado y Notificaciones -->
    <div id="messageBar" class="message-bar info">
      Partida iniciada. Mueven las Blancas.
    </div>

    <!-- Tablero de Juego -->
    <div class="board-wrapper">
      <div class="board-frame">
        <div id="board" class="board-grid"></div>
      </div>
    </div>

    <!-- Controles Inferiores -->
    <div class="controls-bar">
      <button id="btnReset" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
        Reiniciar Partida
      </button>
    </div>
  </div>

  <!-- Modal de Fin de Partida / Victoria -->
  <div id="victoryModal" class="modal-overlay">
    <div class="modal-card">
      <div class="trophy-icon">🏆</div>
      <h2 id="modalWinnerTitle" class="modal-title">¡Victoria!</h2>
      <p id="modalWinnerDesc" class="modal-desc"></p>
      <button id="btnModalPlayAgain" class="btn-primary" style="width: 100%;">
        Jugar de Nuevo
      </button>
    </div>
  </div>

  <!-- ==========================================================================
       LÓGICA DEL JUEGO (JAVASCRIPT)
       ========================================================================== -->
  <script>
    /* ==========================================================================
       1. CONSTANTES Y CONFIGURACIÓN
       ========================================================================== */
    const BOARD_SIZE = 8;
    const TOTAL_PIECES_PER_PLAYER = 12;

    const PLAYER_WHITE = 'white'; // Blancas: inician abajo (filas 5, 6, 7), avanzan hacia arriba (dr = -1)
    const PLAYER_BLACK = 'black'; // Negras: inician arriba (filas 0, 1, 2), avanzan hacia abajo (dr = +1)

    // SVG de la corona dorada para las damas
    const CROWN_SVG = `
      <svg viewBox="0 0 24 24" class="crown-svg" fill="none">
        <path d="M5 16L3 7L8.5 11L12 5L15.5 11L21 7L19 16H5Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
        <path d="M5 17H19V19H5V17Z" fill="#D97706" stroke="#92400E" stroke-width="1"/>
        <circle cx="3" cy="7" r="1.2" fill="#FDE68A"/>
        <circle cx="12" cy="5" r="1.3" fill="#FDE68A"/>
        <circle cx="21" cy="7" r="1.2" fill="#FDE68A"/>
      </svg>
    `;

    /* ==========================================================================
       2. ESTADO DE LA PARTIDA
       ========================================================================== */
    // board[row][col] contendrá null o un objeto { player: 'white'|'black', isKing: boolean }
    let board = [];
    let currentPlayer = PLAYER_WHITE;
    let selectedPiece = null;          // { row, col } de la pieza seleccionada por el usuario
    let validMovesForSelected = [];    // Array de movimientos válidos para la pieza seleccionada
    let multiCapturePiece = null;      // { row, col } si hay una captura múltiple obligatoria en progreso
    let isGameOver = false;
    let capturedWhite = 0;             // Piezas negras capturadas por las blancas
    let capturedBlack = 0;             // Piezas blancas capturadas por las negras
    let soundEnabled = true;

    /* ==========================================================================
       3. SISTEMA DE SONIDO INTEGRADO (Web Audio API)
       ========================================================================== */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'move') {
          // Sonido de deslizamiento/toque suave
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'capture') {
          // Sonido de captura contundente
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.16);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'crown') {
          // Fanfarria arpegiada de coronación
          [440, 554, 659, 880].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.25, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.18);
          });
        } else if (type === 'victory') {
          // Acorde triunfal
          [523.25, 659.25, 783.99, 1046.5].forEach((freq) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.6);
          });
        }
      } catch (e) {
        // Fallback silencioso en caso de restricciones del navegador
      }
    }

    /* ==========================================================================
       4. INICIALIZACIÓN DEL TABLERO
       ========================================================================== */
    /**
     * Comprueba si una coordenada (r, c) está dentro de los límites del tablero 8x8.
     */
    function isValidCoord(r, c) {
      return r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE;
    }

    /**
     * Inicializa el tablero con 12 piezas por jugador en las casillas oscuras.
     * En el tablero clásico, las casillas oscuras cumplen (row + col) % 2 === 1.
     */
    function setupBoard() {
      board = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        const row = [];
        for (let c = 0; c < BOARD_SIZE; c++) {
          const isDarkCell = (r + c) % 2 === 1;

          if (isDarkCell && r < 3) {
            // Filas 0, 1, 2: Piezas Negras (12 en total)
            row.push({ player: PLAYER_BLACK, isKing: false });
          } else if (isDarkCell && r > 4) {
            // Filas 5, 6, 7: Piezas Blancas (12 en total)
            row.push({ player: PLAYER_WHITE, isKing: false });
          } else {
            // Filas intermedias 3, 4 o casillas claras: vacías
            row.push(null);
          }
        }
        board.push(row);
      }

      currentPlayer = PLAYER_WHITE;
      selectedPiece = null;
      validMovesForSelected = [];
      multiCapturePiece = null;
      isGameOver = false;
      capturedWhite = 0;
      capturedBlack = 0;

      updateStatusMessage('Partida iniciada. Mueven las Blancas.', 'info');
      renderBoard();
      renderScoreboard();
    }

    /* ==========================================================================
       5. LÓGICA DE MOVIMIENTOS Y REGLAS CLÁSICAS
       ========================================================================== */

    /**
     * Obtiene todos los movimientos simples (sin captura) para una pieza en (r, c).
     * - Peones: Se mueven 1 casilla en diagonal hacia adelante.
     * - Damas: Se mueven cualquier número de casillas libres en las 4 diagonales.
     */
    function getPieceSimpleMoves(r, c) {
      const piece = board[r][c];
      if (!piece) return [];
      const moves = [];

      if (!piece.isKing) {
        // PEÓN: Avanza en diagonal hacia adelante
        const forwardDr = (piece.player === PLAYER_WHITE) ? -1 : 1;
        const forwardDirections = [
          { dr: forwardDr, dc: -1 },
          { dr: forwardDr, dc: 1 }
        ];

        for (const dir of forwardDirections) {
          const targetR = r + dir.dr;
          const targetC = c + dir.dc;
          if (isValidCoord(targetR, targetC) && board[targetR][targetC] === null) {
            moves.push({
              toRow: targetR,
              toCol: targetC,
              isCapture: false
            });
          }
        }
      } else {
        // DAMA (Rey Volador): Puede recorrer cualquier número de casillas vacías en las 4 direcciones
        const allDirections = [
          { dr: -1, dc: -1 },
          { dr: -1, dc: 1 },
          { dr: 1, dc: -1 },
          { dr: 1, dc: 1 }
        ];

        for (const dir of allDirections) {
          let step = 1;
          while (true) {
            const targetR = r + dir.dr * step;
            const targetC = c + dir.dc * step;

            if (!isValidCoord(targetR, targetC)) break; // Borde del tablero
            if (board[targetR][targetC] !== null) break; // Bloqueado por otra pieza

            moves.push({
              toRow: targetR,
              toCol: targetC,
              isCapture: false
            });
            step++;
          }
        }
      }

      return moves;
    }

    /**
     * Obtiene todos los movimientos de captura válidos para una pieza en (r, c).
     * - Peón: Salta 2 casillas en diagonal hacia adelante por encima de un rival a casilla vacía.
     * - Dama: En las 4 direcciones, recorre casillas vacías, salta una pieza rival y
     *         puede aterrizar en CUALQUIERA de las casillas vacías posteriores en esa diagonal.
     */
    function getPieceCaptures(r, c) {
      const piece = board[r][c];
      if (!piece) return [];
      const captures = [];
      const opponent = (piece.player === PLAYER_WHITE) ? PLAYER_BLACK : PLAYER_WHITE;

      if (!piece.isKing) {
        // PEÓN: Captura saltando hacia adelante sobre una pieza contraria
        const forwardDr = (piece.player === PLAYER_WHITE) ? -1 : 1;
        const captureDirections = [
          { dr: forwardDr, dc: -1 },
          { dr: forwardDr, dc: 1 }
        ];

        for (const dir of captureDirections) {
          const midR = r + dir.dr;
          const midC = c + dir.dc;
          const landR = r + dir.dr * 2;
          const landC = c + dir.dc * 2;

          if (isValidCoord(landR, landC)) {
            const midPiece = board[midR][midC];
            const landCell = board[landR][landC];

            // Debe haber una pieza enemiga intermedia y la casilla de aterrizaje debe estar vacía
            if (midPiece && midPiece.player === opponent && landCell === null) {
              captures.push({
                toRow: landR,
                toCol: landC,
                isCapture: true,
                capturedRow: midR,
                capturedCol: midC
              });
            }
          }
        }
      } else {
        // DAMA (Rey Volador): Captura a distancia en las 4 diagonales
        const allDirections = [
          { dr: -1, dc: -1 },
          { dr: -1, dc: 1 },
          { dr: 1, dc: -1 },
          { dr: 1, dc: 1 }
        ];

        for (const dir of allDirections) {
          let step = 1;
          let enemyPos = null;

          while (true) {
            const checkR = r + dir.dr * step;
            const checkC = c + dir.dc * step;

            if (!isValidCoord(checkR, checkC)) break;

            const currentPiece = board[checkR][checkC];

            if (!enemyPos) {
              if (currentPiece === null) {
                // Casilla vacía previa al enemigo, continuar recorriendo
                step++;
                continue;
              } else if (currentPiece.player === piece.player) {
                // Pieza propia bloquea la diagonal
                break;
              } else {
                // Primera pieza enemiga encontrada
                enemyPos = { r: checkR, c: checkC };
                step++;
                continue;
              }
            } else {
              // Ya se encontró una pieza enemiga: las casillas vacías posteriores son destinos válidos
              if (currentPiece === null) {
                captures.push({
                  toRow: checkR,
                  toCol: checkC,
                  isCapture: true,
                  capturedRow: enemyPos.r,
                  capturedCol: enemyPos.c
                });
                step++; // La dama voladora puede aterrizar más lejos en la misma diagonal
              } else {
                // Otra pieza (amiga o enemiga) interrumpe los aterrizajes posteriores
                break;
              }
            }
          }
        }
      }

      return captures;
    }

    /**
     * Encuentra todas las capturas disponibles para el jugador en todo el tablero.
     * Devuelve un mapa con clave "r,c" -> array de capturas.
     */
    function getAllAvailableCaptures(player) {
      const captureMap = new Map();

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const piece = board[r][c];
          if (piece && piece.player === player) {
            const pieceCaps = getPieceCaptures(r, c);
            if (pieceCaps.length > 0) {
              captureMap.set(`${r},${c}`, pieceCaps);
            }
          }
        }
      }

      return captureMap;
    }

    /**
     * Determina los movimientos legales de una pieza específica en (r, c)
     * respetando estrictamente la regla de CAPTURA OBLIGATORIA.
     */
    function getLegalMovesForPiece(r, c) {
      // 1. Si estamos en una captura múltiple, únicamente la pieza activa puede seguir comiendo
      if (multiCapturePiece) {
        if (multiCapturePiece.row === r && multiCapturePiece.col === c) {
          return getPieceCaptures(r, c);
        }
        return [];
      }

      const piece = board[r][c];
      if (!piece || piece.player !== currentPlayer) return [];

      // 2. Comprobar si existe alguna captura en todo el tablero
      const allCaptures = getAllAvailableCaptures(currentPlayer);

      if (allCaptures.size > 0) {
        // Si hay capturas disponibles, SOLO las piezas que pueden capturar son elegibles
        const key = `${r},${c}`;
        return allCaptures.get(key) || [];
      } else {
        // Si no hay ninguna captura disponible, se permiten los movimientos simples
        return getPieceSimpleMoves(r, c);
      }
    }

    /**
     * Cuenta el total de movimientos legales disponibles para un jugador.
     * Utilizado para verificar la condición de fin de partida.
     */
    function countTotalLegalMoves(player) {
      const allCaptures = getAllAvailableCaptures(player);
      if (allCaptures.size > 0) {
        let totalCaps = 0;
        for (const [_, caps] of allCaptures) {
          totalCaps += caps.length;
        }
        return totalCaps;
      }

      let totalSimple = 0;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const piece = board[r][c];
          if (piece && piece.player === player) {
            totalSimple += getPieceSimpleMoves(r, c).length;
          }
        }
      }
      return totalSimple;
    }

    /* ==========================================================================
       6. EJECUCIÓN DE MOVIMIENTOS Y CORONACIÓN
       ========================================================================== */
    /**
     * Ejecuta el movimiento desde (fromR, fromC) hasta el destino indicado en `move`.
     * Maneja capturas, coronación a dama y encadenamiento de capturas múltiples.
     */
    function executeMove(fromR, fromC, move) {
      const piece = board[fromR][fromC];
      board[fromR][fromC] = null;
      board[move.toRow][move.toCol] = piece;

      let wasCapture = false;
      let wasCoronation = false;

      // 1. Procesar captura si corresponde
      if (move.isCapture) {
        board[move.capturedRow][move.capturedCol] = null;
        wasCapture = true;

        if (piece.player === PLAYER_WHITE) {
          capturedWhite++;
        } else {
          capturedBlack++;
        }
        playSound('capture');
      } else {
        playSound('move');
      }

      // 2. Procesar coronación a Dama si un peón llega a la fila extrema
      // Blancas coronan en fila 0, Negras en fila 7
      if (!piece.isKing) {
        if (piece.player === PLAYER_WHITE && move.toRow === 0) {
          piece.isKing = true;
          wasCoronation = true;
        } else if (piece.player === PLAYER_BLACK && move.toRow === BOARD_SIZE - 1) {
          piece.isKing = true;
          wasCoronation = true;
        }
      }

      if (wasCoronation) {
        playSound('crown');
      }

      // 3. Encadenamiento de capturas (Captura Múltiple)
      // Regla clásica:
      // - Si un peón corona a dama, su turno finaliza inmediatamente al alcanzar la última fila.
      // - Si fue captura y NO coronó, se comprueba si la MISMA pieza puede seguir comiendo desde su nueva posición.
      if (wasCapture && !wasCoronation) {
        const furtherCaptures = getPieceCaptures(move.toRow, move.toCol);
        if (furtherCaptures.length > 0) {
          // El turno continúa obligatoriamente con la misma pieza
          multiCapturePiece = { row: move.toRow, col: move.toCol };
          selectedPiece = { row: move.toRow, col: move.toCol };
          validMovesForSelected = furtherCaptures;

          updateStatusMessage('¡Captura múltiple obligatoria! Continúa comiendo con la misma pieza.', 'warning');
          renderBoard();
          renderScoreboard();
          return;
        }
      }

      // 4. Si no hay más capturas encadenadas, reiniciar selección y finalizar turno
      multiCapturePiece = null;
      selectedPiece = null;
      validMovesForSelected = [];

      let lastEventText = '';
      if (wasCoronation) {
        lastEventText = `¡Coronación! El peón de las ${piece.player === PLAYER_WHITE ? 'Blancas' : 'Negras'} se convirtió en Dama 👑`;
      } else if (wasCapture) {
        lastEventText = `¡Las ${piece.player === PLAYER_WHITE ? 'Blancas' : 'Negras'} capturaron una pieza!`;
      }

      // 5. Pasar el turno al oponente
      switchTurn(lastEventText);
    }

    /**
     * Cambia el turno de juego y evalúa si el siguiente jugador puede mover.
     */
    function switchTurn(lastEventText = '') {
      currentPlayer = (currentPlayer === PLAYER_WHITE) ? PLAYER_BLACK : PLAYER_WHITE;

      // Comprobar si el nuevo jugador tiene movimientos legales
      const movesCount = countTotalLegalMoves(currentPlayer);

      if (movesCount === 0) {
        // Fin de la partida: el jugador en turno no puede realizar ningún movimiento
        isGameOver = true;
        const winner = (currentPlayer === PLAYER_WHITE) ? 'Negras' : 'Blancas';
        const loser = (currentPlayer === PLAYER_WHITE) ? 'Blancas' : 'Negras';

        playSound('victory');
        updateStatusMessage(`🏆 ¡Fin de la partida! Ganan las ${winner}. Las ${loser} no tienen movimientos legales.`, 'success');
        showVictoryModal(winner, loser);
      } else {
        const mandatoryCaps = getAllAvailableCaptures(currentPlayer);
        const playerText = `Turno de las ${currentPlayer === PLAYER_WHITE ? 'Blancas' : 'Negras'}`;

        if (mandatoryCaps.size > 0) {
          const fullMsg = lastEventText
            ? `${lastEventText} — ${playerText} (¡Captura obligatoria!)`
            : `${playerText}. ¡Captura obligatoria!`;
          updateStatusMessage(fullMsg, 'warning');
        } else {
          const fullMsg = lastEventText
            ? `${lastEventText} — ${playerText}.`
            : `${playerText}.`;
          updateStatusMessage(fullMsg, lastEventText ? 'info' : 'normal');
        }
      }

      renderBoard();
      renderScoreboard();
    }

    /* ==========================================================================
       7. INTERACCIÓN DEL USUARIO (CLIC Y TOQUE)
       ========================================================================== */
    /**
     * Gestiona el clic en una casilla del tablero (r, c).
     */
    function handleCellClick(r, c) {
      if (isGameOver) return;

      // 1. Si se hace clic en una casilla marcada como movimiento válido para la pieza seleccionada
      if (selectedPiece) {
        const matchingMove = validMovesForSelected.find(m => m.toRow === r && m.toCol === c);
        if (matchingMove) {
          executeMove(selectedPiece.row, selectedPiece.col, matchingMove);
          return;
        }

        // Si el usuario hace clic directamente sobre la pieza enemiga que se puede capturar
        const captureByEnemy = validMovesForSelected.filter(m => m.isCapture && m.capturedRow === r && m.capturedCol === c);
        if (captureByEnemy.length === 1) {
          executeMove(selectedPiece.row, selectedPiece.col, captureByEnemy[0]);
          return;
        } else if (captureByEnemy.length > 1) {
          updateStatusMessage('Elige la casilla vacía de aterrizaje para la Dama.', 'info');
          return;
        }
      }

      // 2. Si estamos en medio de una captura múltiple, no se permite cambiar de pieza
      if (multiCapturePiece) {
        if (r !== multiCapturePiece.row || c !== multiCapturePiece.col) {
          updateStatusMessage('¡Debes completar la captura múltiple con la pieza activa!', 'warning');
          return;
        }
      }

      // 3. Selección de pieza propia
      const piece = board[r][c];
      if (piece && piece.player === currentPlayer) {
        const legalMoves = getLegalMovesForPiece(r, c);

        // Verificar si hay capturas obligatorias que impiden mover esta pieza
        const allCaptures = getAllAvailableCaptures(currentPlayer);
        if (allCaptures.size > 0 && legalMoves.length === 0) {
          updateStatusMessage('¡Captura obligatoria! Debes mover una pieza que pueda comer.', 'warning');
          return;
        }

        if (legalMoves.length > 0) {
          selectedPiece = { row: r, col: c };
          validMovesForSelected = legalMoves;
          renderBoard();
        } else {
          updateStatusMessage('Esta pieza no tiene movimientos disponibles.', 'info');
        }
      } else {
        // Clic en casilla vacía o del oponente sin mover: deseleccionar
        if (!multiCapturePiece) {
          selectedPiece = null;
          validMovesForSelected = [];
          renderBoard();
        }
      }
    }

    /* ==========================================================================
       8. RENDERIZADO VISUAL
       ========================================================================== */
    /**
     * Dibuja el tablero 8x8, las piezas, las damas y las marcas de movimientos válidos.
     */
    function renderBoard() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';

      // Determinar qué piezas tienen captura obligatoria para resaltarlas visualmente
      const captureMap = getAllAvailableCaptures(currentPlayer);

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          const isDark = (r + c) % 2 === 1;
          cell.className = `cell ${isDark ? 'dark' : 'light'}`;

          // Coordenadas sutiles en los bordes
          if (c === 0) {
            const coordR = document.createElement('span');
            coordR.className = 'cell-coord row';
            coordR.textContent = 8 - r;
            cell.appendChild(coordR);
          }
          if (r === 7) {
            const coordC = document.createElement('span');
            coordC.className = 'cell-coord col';
            coordC.textContent = String.fromCharCode(65 + c);
            cell.appendChild(coordC);
          }

          // Resaltar casilla seleccionada
          if (selectedPiece && selectedPiece.row === r && selectedPiece.col === c) {
            cell.classList.add('selected');
          }

          // Si es una casilla oscura, agregar interactividad
          if (isDark) {
            cell.addEventListener('click', () => handleCellClick(r, c));

            // Indicadores de movimiento válido
            if (selectedPiece) {
              const move = validMovesForSelected.find(m => m.toRow === r && m.toCol === c);
              if (move) {
                const targetIndicator = document.createElement('div');
                targetIndicator.className = move.isCapture ? 'capture-target' : 'move-target';
                cell.appendChild(targetIndicator);
              }
            }

            // Dibujar pieza si existe
            const piece = board[r][c];
            if (piece) {
              const pieceEl = document.createElement('div');
              pieceEl.className = `piece ${piece.player} ${piece.isKing ? 'king' : ''}`;

              // Resaltar piezas con captura obligatoria
              if (!isGameOver && piece.player === currentPlayer && captureMap.has(`${r},${c}`)) {
                pieceEl.classList.add('must-capture');
                pieceEl.title = 'Captura obligatoria disponible';
              }

              // Si es Dama, incluir icono de corona
              if (piece.isKing) {
                pieceEl.innerHTML = CROWN_SVG;
              }

              cell.appendChild(pieceEl);
            }
          }

          boardElement.appendChild(cell);
        }
      }
    }

    /**
     * Actualiza el marcador, turno activo y cementerio de piezas capturadas.
     */
    function renderScoreboard() {
      // Indicador de turno en las tarjetas de jugador
      const cardWhite = document.getElementById('cardWhite');
      const cardBlack = document.getElementById('cardBlack');

      if (currentPlayer === PLAYER_WHITE) {
        cardWhite.classList.add('active');
        cardBlack.classList.remove('active');
      } else {
        cardBlack.classList.add('active');
        cardWhite.classList.remove('active');
      }

      // Contadores de capturas
      document.getElementById('capturedWhite').textContent = `${capturedWhite} / ${TOTAL_PIECES_PER_PLAYER}`;
      document.getElementById('capturedBlack').textContent = `${capturedBlack} / ${TOTAL_PIECES_PER_PLAYER}`;

      // Graveyard (piezas enemigas capturadas representadas gráficamente)
      const graveWhite = document.getElementById('graveyardWhite');
      graveWhite.innerHTML = '';
      for (let i = 0; i < capturedWhite; i++) {
        const token = document.createElement('span');
        token.className = 'dead-token black';
        graveWhite.appendChild(token);
      }

      const graveBlack = document.getElementById('graveyardBlack');
      graveBlack.innerHTML = '';
      for (let i = 0; i < capturedBlack; i++) {
        const token = document.createElement('span');
        token.className = 'dead-token white';
        graveBlack.appendChild(token);
      }
    }

    /**
     * Muestra mensajes con estilo (info, warning, success).
     */
    function updateStatusMessage(text, type = 'info') {
      const msgBar = document.getElementById('messageBar');
      msgBar.textContent = text;
      msgBar.className = `message-bar ${type}`;
    }

    /**
     * Despliega el modal de victoria al terminar el juego.
     */
    function showVictoryModal(winner, loser) {
      const modal = document.getElementById('victoryModal');
      const title = document.getElementById('modalWinnerTitle');
      const desc = document.getElementById('modalWinnerDesc');

      title.textContent = `¡Ganan las ${winner}!`;
      desc.textContent = `Las ${loser} se han quedado sin movimientos válidos. ¡Excelente partida!`;
      modal.classList.add('show');
    }

    function hideVictoryModal() {
      const modal = document.getElementById('victoryModal');
      modal.classList.remove('show');
    }

    /* ==========================================================================
       9. ASIGNACIÓN DE EVENTOS DE BOTONES
       ========================================================================== */
    document.getElementById('btnReset').addEventListener('click', () => {
      setupBoard();
    });

    document.getElementById('btnModalPlayAgain').addEventListener('click', () => {
      hideVictoryModal();
      setupBoard();
    });

    document.getElementById('btnSound').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      const soundIcon = document.getElementById('soundIcon');
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
    });

    // Ciclo de paletas de color de fondo
    const themes = [
      { id: '', name: 'Azul Medianoche', icon: '🌌' },
      { id: 'theme-wood', name: 'Madera Cálida', icon: '🪵' },
      { id: 'theme-emerald', name: 'Verde Torneo', icon: '🌲' },
      { id: 'theme-carbon', name: 'Carbón Minimalista', icon: '🌑' }
    ];
    let currentThemeIdx = 0;

    document.getElementById('btnTheme').addEventListener('click', () => {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      const theme = themes[currentThemeIdx];
      document.body.className = theme.id;
      document.getElementById('themeIcon').textContent = theme.icon;
      updateStatusMessage(`Fondo: ${theme.name}`, 'info');
    });

    // Iniciar juego al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      setupBoard();
    });
  </script>
</body>
</html>
