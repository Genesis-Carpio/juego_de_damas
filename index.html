<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damas clásicas</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app">
  <header><h1>♛ Damas clásicas</h1><p>Captura obligatoria · damas voladoras</p></header>
  <section id="setup" class="panel setup" aria-labelledby="setup-title">
    <h2 id="setup-title">Nueva partida</h2>
    <div class="choice-group"><span>Modo</span><div class="choices" id="modeChoices"><button class="choice selected" data-mode="local">En pareja</button><button class="choice" data-mode="ai">Contra la máquina</button></div></div>
    <div id="difficultyRow" class="choice-group hidden"><span>Dificultad</span><div class="choices" id="difficultyChoices"><button class="choice selected" data-level="easy">Fácil</button><button class="choice" data-level="medium">Medio</button><button class="choice" data-level="hard">Difícil</button></div></div>
    <button id="startButton" class="primary">Comenzar partida</button>
  </section>
  <section id="game" class="hidden" aria-live="polite">
    <div class="topline"><button id="newGame" class="secondary">← Opciones</button><button id="restart" class="secondary">Reiniciar</button></div>
    <div class="players"><article id="whiteCard" class="player active"><b><i class="token white"></i><span id="whiteLabel">Blancas</span></b><small>Capturadas: <strong id="whiteCaptured">0</strong></small></article><article id="blackCard" class="player"><b><i class="token black"></i><span id="blackLabel">Negras</span></b><small>Capturadas: <strong id="blackCaptured">0</strong></small></article></div>
    <p id="status" class="status">Turno de las blancas.</p><div id="board" class="board" role="grid" aria-label="Tablero de damas"></div><p class="hint">Las capturas son obligatorias. Una dama puede recorrer toda la diagonal.</p>
  </section>
</main><div id="resultModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="modal-card"><div class="cup">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="playAgain" class="primary">Jugar de nuevo</button></div></div><script src="game.js"></script></body></html>
