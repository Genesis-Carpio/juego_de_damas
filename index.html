<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Damas clásicas</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><h1>♛ Damas clásicas</h1><p>Captura obligatoria · damas voladoras</p></header><section id="setup" class="panel setup"><h2>Nueva partida</h2><div class="choice-group"><span>Modo</span><div class="choices"><button class="choice selected" data-mode="local">En pareja (mismo equipo)</button><button class="choice" data-mode="online">Enlace para jugar</button><button class="choice" data-mode="ai">Contra la máquina</button></div></div><div id="difficultyRow" class="choice-group hidden"><span>Dificultad</span><div class="choices"><button class="choice selected" data-level="easy">Fácil</button><button class="choice" data-level="medium">Medio</button><button class="choice" data-level="hard">Difícil</button></div></div><button id="startButton" class="primary">Comenzar partida</button></section><section id="game" class="hidden" aria-live="polite"><div class="topline"><button id="newGame" class="secondary">← Opciones</button><button id="restart" class="secondary">Reiniciar</button></div><div id="shareRow" class="share hidden"><input id="shareLink" readonly aria-label="Enlace de la partida"><button id="copyLink" class="secondary">Copiar enlace</button></div><div class="players"><article id="whiteCard" class="player active"><b><i class="token white"></i><span>Blancas</span></b><small>Capturadas: <strong id="whiteCaptured">0</strong></small></article><article id="blackCard" class="player"><b><i class="token black"></i><span id="blackLabel">Negras</span></b><small>Capturadas: <strong id="blackCaptured">0</strong></small></article></div><p id="status" class="status">Turno de las blancas.</p><div id="board" class="board" role="grid" aria-label="Tablero de damas"></div><p class="hint">Las capturas son obligatorias. Una dama puede recorrer toda la diagonal.</p></section></main><div id="resultModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="cup">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="playAgain" class="primary">Jugar de nuevo</button></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script src="game.js"></script></body></html>
