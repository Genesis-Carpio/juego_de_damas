<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Damas clásicas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>♛ Damas clásicas</h1>
      <p class="subtitle">Captura obligatoria · Damas voladoras</p>
    </header>

    <!-- Pantalla de configuración inicial -->
    <section id="setup" class="panel setup" aria-labelledby="setupTitle">
      <h2 id="setupTitle">Nueva partida</h2>
      
      <div class="choice-group">
        <span>Modo de juego</span>
        <div class="choices">
          <button class="choice selected" data-mode="local">En pareja (mismo equipo)</button>
          <button class="choice" data-mode="online">Enlace para jugar (Online)</button>
          <button class="choice" data-mode="ai">Contra la máquina</button>
        </div>
      </div>

      <div id="difficultyRow" class="choice-group hidden">
        <span>Dificultad de la máquina</span>
        <div class="choices">
          <button class="choice selected" data-level="easy">Fácil</button>
          <button class="choice" data-level="medium">Medio</button>
          <button class="choice" data-level="hard">Difícil</button>
        </div>
      </div>

      <button id="startButton" class="primary start-btn">Comenzar partida</button>
    </section>

    <!-- Pantalla de juego -->
    <section id="game" class="hidden game-view" aria-live="polite">
      <div class="topline">
        <div class="topline-left">
          <button id="newGame" class="secondary" title="Volver al menú">← Opciones</button>
          <button id="restart" class="secondary" title="Reiniciar tablero">Reiniciar</button>
        </div>
        <div class="topline-right">
          <button id="flipBtn" class="icon-btn" title="Girar vista del tablero" aria-label="Girar tablero">🔄</button>
          <button id="soundBtn" class="icon-btn" title="Activar o desactivar sonido" aria-label="Sonido">🔊</button>
        </div>
      </div>

      <!-- Compartir enlace para modo online -->
      <div id="shareRow" class="share hidden">
        <button id="shareBtn" class="primary share-action-btn">📲 Invitar / Compartir enlace</button>
        <input id="shareLink" readonly aria-label="Enlace de la partida" value="">
      </div>

      <!-- Tarjetas de jugadores y capturas -->
      <div class="players">
        <article id="whiteCard" class="player active">
          <b>
            <i class="token white"></i>
            <span id="whiteLabel">Blancas</span>
          </b>
          <small>Capturadas: <strong id="whiteCaptured">0</strong></small>
        </article>

        <article id="blackCard" class="player">
          <b>
            <i class="token black"></i>
            <span id="blackLabel">Negras</span>
          </b>
          <small>Capturadas: <strong id="blackCaptured">0</strong></small>
        </article>
      </div>

      <!-- Estado del turno / avisos -->
      <p id="status" class="status">Turno de las blancas.</p>

      <!-- Tablero 8x8 -->
      <div class="board-wrapper">
        <div id="board" class="board" role="grid" aria-label="Tablero de damas"></div>
      </div>

      <p class="hint">Las capturas son obligatorias. Una dama puede recorrer toda la diagonal.</p>
    </section>
  </main>

  <!-- Modal de victoria / fin de partida -->
  <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal-card">
      <div class="cup">🏆</div>
      <h2 id="resultTitle">Partida finalizada</h2>
      <p id="resultText"></p>
      <button id="playAgain" class="primary">Jugar de nuevo</button>
    </div>
  </div>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <!-- Scripts del juego -->
  <script src="js/firebase-config.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
